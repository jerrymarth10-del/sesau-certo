<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>JR Apostilas • Abrindo acesso</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111b;color:#f7fbff;font-family:Arial,Helvetica,sans-serif;padding:24px}
    .box{width:min(520px,100%);padding:30px;border:1px solid #253443;border-radius:20px;background:#0e1a27;box-shadow:0 18px 60px rgba(0,0,0,.28);text-align:center}
    .brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#71e7bd;font-weight:800}
    h1{font-size:27px;margin:10px 0 12px}
    p{color:#b7c4d2;line-height:1.55;margin:0}
    .dot{width:42px;height:42px;margin:24px auto 0;border:4px solid #243545;border-top-color:#ff3049;border-radius:50%;animation:spin .8s linear infinite}
    .error{display:none;margin-top:20px;padding:14px;border-radius:12px;background:#35151b;color:#ffd8dd}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">JR Apostilas</div>
    <h1>Abrindo seu preparatório…</h1>
    <p>Estamos validando sua compra e preparando o acesso à área adquirida.</p>
    <div class="dot" id="loader" aria-hidden="true"></div>
    <div class="error" id="error">Este link está inválido ou expirou. Volte ao checkout e use a opção de recuperar acesso.</div>
  </main>
  <script>
    (function(){
      var raw=(location.hash||'').replace(/^#/,'');
      var params=new URLSearchParams(raw);
      var token=params.get('token')||'';
      history.replaceState(null,'',location.pathname);
      if(!token || token.length>8192){
        document.getElementById('loader').style.display='none';
        document.getElementById('error').style.display='block';
        return;
      }
      var form=document.createElement('form');
      form.method='POST';
      form.action='/api/purchase-entry';
      form.style.display='none';
      var input=document.createElement('input');
      input.type='hidden';
      input.name='token';
      input.value=token;
      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
    })();
  </script>
</body>
</html>
