name: Teste Cuidador Social
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/cuidador-social-semusa-20261016]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar Cuidador Social
        run: node scripts/test-cuidador-social.cjs
