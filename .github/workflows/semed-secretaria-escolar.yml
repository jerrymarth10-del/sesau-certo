name: SEMED Secretaria Escolar - regressao
on:
  push:
    branches:
      - feat/secretaria-escolar-semed-20261016
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar novo bloco e regressoes
        run: |
          node tests/secretaria-escolar.cjs
