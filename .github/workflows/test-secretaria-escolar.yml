name: Teste Secretaria Escolar Projeto 1
on:
  push:
    branches: [feat/secretaria-escolar-semed-20261016]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe, card e liberação
        run: |
          node --check lib/secretaria-escolar.js
          node --check api/area-entry.js
          node --check api/_entitlement.js
          node scripts/test-secretaria-escolar.cjs
