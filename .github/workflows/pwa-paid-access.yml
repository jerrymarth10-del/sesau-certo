name: PWA aluno pago — teste de segurança
on:
  push:
    branches: [feat/pwa-aluno-compra-20261016]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pwa-paid-access.cjs
